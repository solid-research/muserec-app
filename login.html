<html>
<head>
    <title>MuseRec</title>
    <link href="https://unpkg.com/tailwindcss@1.9.6/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
    <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
            <h1 class="text-center text-lg font-bold">
                Welcome to MuseRec!
            </h1>
            <h2 class="text-center text-sm">
                Please input your OIDC provider to start.
            </h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            <form class="space-y-6" action="/login" method="POST">
                <div>
                    <label for="oidc_provider" class="block text-sm font-medium leading-6 text-gray-900">OIDC Provider</label>
                    <div class="mt-2">
                        <input placeholder="https://login.inrupt.com" id="oidc_provider" name="oidc_provider" type="text" autocomplete="oidc_provider" required class="block w-full rounded-md border-0 py-3 px-3 text-gray-900 shadow-lg ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
                    </div>
                </div>

                <div>
                    <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-6 py-3 text-base font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Sign in</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
